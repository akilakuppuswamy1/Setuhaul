services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: setuhaul
      POSTGRES_PASSWORD: setuhaul
      POSTGRES_DB: setuhaul
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql

volumes:
  postgres_data:
